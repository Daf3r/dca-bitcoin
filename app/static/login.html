<section class="escena" aria-label="Libro DCA">
  <div class="montana" id="montana" aria-hidden="true"></div>
  <div class="cima"><p class="marca"><svg class="marca-ico" viewBox="0 0 24 18" aria-hidden="true"><path pathLength="1" d="M1.5 16.5 9 3.5l4 6.5 3-4 6.5 10.5Z"/></svg>Libro <b>DCA</b></p></div>

<main class="login">
  <form class="login-caja" id="f-login" novalidate>
    <h1>Entrar</h1>
    <p class="login-lema">El libro de compras de la familia. Entra para ver cómo va la subida.</p>
    <p class="login-aviso" id="l-aviso" hidden></p>
    <label class="campo-l" for="l-usuario">Usuario</label>
    <input id="l-usuario" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="campo-l" for="l-clave">Contraseña</label>
    <input id="l-clave" name="password" type="password" autocomplete="current-password" required>
    <label class="l-comp" for="l-compartido"><input type="checkbox" id="l-compartido"> <span>Este dispositivo es compartido: se cierra solo a las 4 horas</span></label>
    <p class="login-error" id="l-error" role="alert"></p>
    <button type="submit" class="guardar" id="l-entrar">Entrar</button>
    <p class="login-pie">¿Olvidaste tu contraseña? Pídele al administrador que te ponga una nueva.</p>
  </form>
