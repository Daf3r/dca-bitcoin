name: Pruebas

# Corre las pruebas en cada PR y en cada cambio a main. Ninguna toca la red ni el servidor real.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rapidas:
    name: API y cálculos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - name: API (Flask con base temporal y exchanges simulados)
        run: python tests/test_api.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cálculos del frontend
        run: node tests/test_lib.mjs

  navegador:
    name: Navegador (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Pruebas de navegador contra el servidor de pruebas
        run: node tests/test_ui.mjs
