name: Pruebas

# Corre las pruebas en cada PR y en cada cambio a main. Ninguna toca la red ni el servidor real.
# Los trabajos «informativos» (regresión visual, seguridad de dependencias e imagen) no bloquean un PR por sí solos:
# dejan su resultado a la vista, y el flujo semanal los corre sin tolerancia para que un problema llegue por correo.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rapidas:
    name: API y cálculos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements-dev.txt
      - run: pip install -r app/requirements.txt -r tests/requirements-dev.txt
      - name: Revisión del código (ruff y tipos con mypy)
        run: |
          ruff check app --select E9,F,B,UP,SIM --ignore E501,SIM108,UP007
          mypy app/server.py app/auth.py app/usuarios.py app/backup.py app/importar.py app/push.py app/ritmo.py app/avisos.py app/salud.py --ignore-missing-imports
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API (Flask con base temporal y exchanges simulados; compara las reglas de los avisos con lib.js)
        run: coverage run --source=app tests/test_api.py
      - name: Cobertura de las pruebas de API
        run: |
          {
            echo '### Cobertura de las pruebas de API'
            echo
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cálculos del frontend
        run: node tests/test_lib.mjs

  javascript:
    name: JavaScript (revisión)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - name: Revisión del JavaScript con Biome
        run: npx --prefix tests biome lint

  navegador:
    name: Navegador (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Pruebas de navegador contra el servidor de pruebas
        run: node tests/test_ui.mjs

  accesibilidad:
    name: Accesibilidad (axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Auditoría con axe-core en los estados principales, en claro y oscuro
        run: node tests/auditoria_axe.mjs

  rendimiento:
    name: Rendimiento (Lighthouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Lighthouse en la entrada y en la app (umbrales holgados)
        run: node tests/rendimiento_lighthouse.mjs

  imagen:
    name: Imagen de Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose es válido
        run: docker compose config -q
      - name: Construir la imagen
        run: docker build -t libro-dca:ci ./app
      - name: Los módulos se importan dentro de la imagen
        run: >
          docker run --rm -e DB_PATH=/tmp/ci/libro.db libro-dca:ci
          python -c "import server, auth, usuarios, backup, importar, push, ritmo, avisos, salud; print('módulos ok')"
      - name: El servicio de avisos hace una pasada sin errores
        run: docker run --rm -e DB_PATH=/tmp/ci/libro.db libro-dca:ci python avisos.py
      - name: La app arranca con gunicorn (endurecida como en producción) y responde
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e DB_PATH=/tmp/ci/libro.db -p 18000:8000 libro-dca:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18000/healthz
          curl -fsS http://127.0.0.1:18000/api/estado
          docker logs app | tail -15
          docker rm -f app
      - name: Los chequeos de salud de los servicios responden
        run: |
          docker run --rm -e DB_PATH=/tmp/ci/libro.db libro-dca:ci sh -c 'python salud.py respaldo && echo "respaldo: sano sin base"'
          docker run --rm -e DB_PATH=/tmp/ci/libro.db libro-dca:ci sh -c 'python salud.py avisos; test $? -eq 1 && echo "avisos: sin marca, no sano (esperado)"'
      - name: Vulnerabilidades en la imagen (Trivy, informativo en los PR)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: libro-dca:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependencias:
    name: Dependencias (vulnerabilidades conocidas)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Librerías de Python de la app
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r app/requirements.txt
      - name: Herramientas de pruebas de JavaScript
        run: npm audit --prefix tests --audit-level=high

  visual:
    name: Regresión visual (informativa)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Recuperar la referencia de main
        id: ref
        uses: actions/cache/restore@v4
        with:
          path: visual-ref
          key: visual-ref-${{ github.sha }}
          restore-keys: visual-ref-
      - name: Comparar con la referencia (en los PR)
        if: github.event_name == 'pull_request' && steps.ref.outputs.cache-matched-key != ''
        run: node tests/regresion_visual.mjs --comparar visual-ref
      - name: Sin referencia todavía
        if: github.event_name == 'pull_request' && steps.ref.outputs.cache-matched-key == ''
        run: echo "Aún no hay una referencia guardada en main; se crea con el próximo cambio a main." >> "$GITHUB_STEP_SUMMARY"
      - name: Subir las diferencias
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: regresion-visual
          path: tests/regresion/
          if-no-files-found: ignore
      - name: Guardar la nueva referencia (en main)
        if: github.event_name == 'push'
        run: node tests/regresion_visual.mjs --guardar visual-ref
      - name: Guardar la referencia en la caché (en main)
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: visual-ref
          key: visual-ref-${{ github.sha }}
