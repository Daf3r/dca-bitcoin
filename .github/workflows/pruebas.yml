name: Pruebas

# Corre las pruebas en cada PR y en cada cambio a main. Ninguna toca la red ni el servidor real.
# Los trabajos «informativos» (regresión visual, seguridad de dependencias e imagen) no bloquean un PR por sí solos:
# dejan su resultado a la vista, y el flujo semanal los corre sin tolerancia para que un problema llegue por correo.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # (para lanzarlo a mano cuando haya minutos de CI)

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rapidas:
    name: API y cálculos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements-dev.txt
      - run: pip install -r app/requirements.txt -r tests/requirements-dev.txt
      - name: Revisión del código (ruff y tipos con mypy)
        run: |
          ruff check app --select E9,F,B,UP,SIM --ignore E501,SIM108,UP007
          mypy app/server.py app/auth.py app/usuarios.py app/backup.py app/importar.py app/push.py app/recorte.py app/ritmo.py app/avisos.py app/salud.py --ignore-missing-imports
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API (Flask con base temporal y exchanges simulados; compara las reglas de los avisos con lib.js)
        run: coverage run --source=app tests/test_api.py
      - name: Cobertura de las pruebas de API
        run: |
          {
            echo '### Cobertura de las pruebas de API'
            echo
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Envío push real contra un servicio de push falso (cifrado y firma VAPID)
        run: python tests/test_push_real.py
      - name: Reglas del dinero con miles de operaciones aleatorias (y comparadas con lib.js)
        run: python tests/test_aleatorio.py
      - name: Cálculos del frontend
        run: node tests/test_lib.mjs

  javascript:
    name: JavaScript (revisión)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - name: Revisión del JavaScript con Biome
        run: npx --prefix tests biome lint
      - name: Tipos de lib.js (JSDoc comprobado con tsc; no emite nada)
        run: npx --prefix tests tsc -p tests/tsconfig.json
      # El servidor sirve los estáticos sin comentarios (app/recorte.py, solo biblioteca estándar: basta el python3 del sistema).
      - name: Quitar los comentarios al servir no cambia el código (árbol de TypeScript de cada .js y símbolos del CSS)
        run: node tests/comprobar_recorte.mjs

  navegador:
    # test_ui entero tarda ~66 min en serie. Va en tres trabajos (los mismos checks de siempre: 1/3, 2/3 y 3/3) y cada uno corre dos
    # sextas partes A LA VEZ (campamento 61: las pruebas esperan sobre todo a las animaciones, no a la CPU, y el runner tiene 4 núcleos):
    # ~11–13 min de pruebas por trabajo en vez de ~21 (proyectado en el sandbox; lo confirma la primera corrida real). El reparto lo hace
    # el propio test_ui con lo que tarda cada bloque (PESOS), y cada parte comprueba que todos los bloques tienen la suya (PARTE=reparto/6
    # lo enseña). Cada sexta parte, con su servidor y su registro (si falla, verificar_todo enseña su final; entero, en los artefactos).
    name: Navegador (Playwright) ${{ matrix.parte }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - parte: "1/3"
            sextas: "ui:1/6 ui:2/6"
          - parte: "2/3"
            sextas: "ui:3/6 ui:4/6"
          - parte: "3/3"
            sextas: "ui:5/6 ui:6/6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Pruebas de navegador contra el servidor de pruebas (parte ${{ matrix.parte }}, en dos sextas partes a la vez)
        # (por debajo del límite del trabajo: si algo se cuelga, el paso siguiente aún sube los registros de cada sexta)
        timeout-minutes: 34
        run: node tests/verificar_todo.mjs ${{ matrix.sextas }}
        env:
          UI_PARTES: "6"
      - name: Subir los registros de cada sexta parte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-navegador-${{ strategy.job-index }}
          path: tests/registros/
          if-no-files-found: ignore

  accesibilidad:
    name: Accesibilidad (axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      # (Campamento 61) Claro y oscuro a la vez, cada uno en su proceso (ESQUEMA): los mismos estados que en uno solo, en la mitad del tiempo.
      - name: Auditoría con axe-core en los estados principales, en claro y oscuro
        timeout-minutes: 25
        run: node tests/verificar_todo.mjs axe
      - name: Subir los registros de axe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-axe
          path: tests/registros/
          if-no-files-found: ignore

  rendimiento:
    name: Rendimiento (Lighthouse y banco de la escena)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Banco de la escena (topes de nodos y animaciones a la vista por capa; los fps solo informan)
        run: node tests/banco_rendimiento.mjs
      - name: Lighthouse en la entrada y en la app (umbrales holgados)
        run: node tests/rendimiento_lighthouse.mjs

  imagen:
    name: Imagen de Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose es válido
        run: docker compose config -q
      - name: Construir la imagen
        run: docker build -t libro-dca:ci ./app
      - name: Los módulos se importan dentro de la imagen
        run: >
          docker run --rm -e DB_PATH=/tmp/ci/libro.db libro-dca:ci
          python -c "import server, auth, usuarios, backup, importar, push, recorte, ritmo, avisos, salud; print('módulos ok')"
      - name: El servicio de avisos hace una pasada sin errores
        run: docker run --rm -e DB_PATH=/tmp/ci/libro.db libro-dca:ci python avisos.py
      - name: La app arranca con gunicorn (endurecida como en producción) y responde
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e DB_PATH=/tmp/ci/libro.db -p 18000:8000 libro-dca:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18000/healthz
          curl -fsS http://127.0.0.1:18000/api/estado
          docker logs app | tail -15
          docker rm -f app
      - name: Los chequeos de salud de los servicios responden
        run: |
          docker run --rm -e DB_PATH=/tmp/ci/libro.db libro-dca:ci sh -c 'python salud.py respaldo && echo "respaldo: sano sin base"'
          docker run --rm -e DB_PATH=/tmp/ci/libro.db libro-dca:ci sh -c 'python salud.py avisos; test $? -eq 1 && echo "avisos: sin marca, no sano (esperado)"'
      # Trivy fijado por versión y huella (0.76.2, la «latest» del 5 nov 2026): con el socket de Docker montado, no se corre una imagen
      # que cambie sola. Para actualizarlo: la versión nueva y su huella de hub.docker.com/r/aquasec/trivy/tags.
      - name: Vulnerabilidades en la imagen (Trivy, informativo en los PR)
        continue-on-error: true
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 libro-dca:ci

  dependencias:
    name: Dependencias (vulnerabilidades conocidas)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Librerías de Python de la app
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r app/requirements.txt
      - name: Herramientas de pruebas de JavaScript
        run: npm audit --prefix tests --audit-level=high

  visual:
    name: Regresión visual (informativa)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Recuperar la referencia de main
        id: ref
        uses: actions/cache/restore@v4
        with:
          path: visual-ref
          key: visual-ref-${{ github.sha }}
          restore-keys: visual-ref-
      - name: Comparar con la referencia (en los PR)
        if: github.event_name == 'pull_request' && steps.ref.outputs.cache-matched-key != ''
        run: node tests/regresion_visual.mjs --comparar visual-ref
      - name: Sin referencia todavía
        if: github.event_name == 'pull_request' && steps.ref.outputs.cache-matched-key == ''
        run: echo "Aún no hay una referencia guardada en main; se crea con el próximo cambio a main." >> "$GITHUB_STEP_SUMMARY"
      - name: Subir las diferencias
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: regresion-visual
          path: tests/regresion/
          if-no-files-found: ignore
      - name: Guardar la nueva referencia (en main)
        if: github.event_name == 'push'
        run: node tests/regresion_visual.mjs --guardar visual-ref
      - name: Guardar la referencia en la caché (en main)
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: visual-ref
          key: visual-ref-${{ github.sha }}
